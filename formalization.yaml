status:
  scope: >-
    Formalized: the results listed under alignment. Not formalized: Gauss's criterion p = a^2 + 64b^2;
    Barkan's evaluation B_(1,Theta) = -2 Omega and the relative class number formula (Proposition 4.1),
    and Dirichlet's formula kappa = h(-4p)/2, which serve only to read the results as statements about
    class numbers; Theorem 3.1 for characters of order 2^b >= 8 and the octic part of Corollary 3.4; the
    pattern witnesses; the 2-class group (Theorem 6.1, Corollary 6.2), which needs class field theory;
    the witness pairs (Theorem 7.1), which need class numbers; the counterexample at p = 337, the
    questions and the observations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the paper's
        statements and proofs, compiled locally with lake, and the export of Solution was checked
        with the Lean kernel, nanoda and con-ron.
      cost:
        wall_time: "about one day"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was given the paper's statements and proofs and asked to formalize them without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the scope (the elementary part of Paper IV: Sections 2 and 3, the ladder of
    Section 5 and Section 8).

fidelity:
  divergences: >-
    The thresholds are stated as divisibility of N(Omega) = x^2 + y^2 and N(B_2) = c0^2 + c1^2, since
    padicValInt 2 0 = 0; the valuation forms give the exact values 1, 2 and 5, 6, and the lower bounds
    3 and 7 under the hypotheses Omega != 0 and B_(2,chi) != 0, which always hold but need analytic
    input. w = 1 is the hypothesis chi 2 = 1, proved equivalent to 2 being a fourth power in ZMod p.
    kappa is the Legendre sum over (0, p/4) and the fifth threshold is stated for 2N(Omega); the
    identifications with h(-4p)/2 and h^-(K) are not formalized. Theorem 3.1 is formalized at order 4
    only, with c0, c1 defined by integer division, which weight_two_integrality shows is exact.
    Lemma 8.1 is proved without its hypothesis w = 1. The parity statements are proved class by class
    from the Gauss-Lehmer product rather than from doubling orbits, and the thresholds from the
    coordinates rather than from the term valuations of Lemma 5.1.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The definitions in Challenge.lean are copied verbatim from the development and compared by
    Comparator. The statements and the companion paper were checked by an independent AI review, and
    check/statements.py recomputes every statement for both quartic characters modulo all 556 primes
    p = 1 (mod 8) below 20000. No external referee has reviewed the paper or the formalization.

