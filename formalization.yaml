version: "v0.4"

project:
  name: "QuarterSumLadder: the quarter-sum ladder and the weight-two congruences"
  description: >-
    For a prime p = 1 (mod 8) and a quartic character chi modulo p (even, with w = chi(2) = +-1),
    the development proves that the coordinates of B_(2,chi) = c0 + i c1 are integers with
    c0 = 4(E_1 + E_-1), c1 = 4(E_i + E_-i) and c0 + c1 = p - 1 modulo 8, and that 8 divides both
    exactly when w = 1, i.e. when 2 is a fourth power. A Gauss-Lehmer product argument gives the
    quartic Gauss lemma w = (-1)^(R_1 + R_3) for the quarter counts R_r, the parity of the four quarter
    counts when w = 1, and the parity of R_2 through the order of 2. For the quarter sum
    Omega = x + iy (2N(Omega) = h^-(K) for the imaginary cyclic quartic field K of conductor 4p, not
    formalized) it proves criteria in the quarter counts for 2^k | 2N(Omega), 2 <= k <= 6, a classical
    evaluation of the fourth, the coordinate valuation formula, a congruence modulo 16 linking c0 - c1
    to x - y, and the valuation of B_(2,chi) at 1 + i on its first three cases.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

